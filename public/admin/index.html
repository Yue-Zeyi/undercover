<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谁是卧底 · 管理后台</title>
  <style>
    :root{--ink:#172923;--muted:#77827b;--green:#187e69;--soft:#e8f3ed;--line:#dfe7e2;--paper:#f6f8f7;--danger:#b4473d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1160px;margin:0 auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}.brand{font-size:22px;font-weight:750}.brand small{color:var(--muted);font-size:12px;font-weight:400;margin-left:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}.panel h2{font-size:16px;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;min-height:42px;padding:9px 11px;font:inherit;color:var(--ink);background:#fff}.field textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;margin-top:15px}.button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 16px;font:inherit;cursor:pointer;color:var(--ink)}.button.primary{background:var(--green);border-color:var(--green);color:#fff}.button.danger{color:var(--danger)}.button:disabled{opacity:.5;cursor:default}.muted{color:var(--muted);font-size:12px}.error{color:var(--danger);background:#fff0eb;border:1px solid #f0cfc3;border-radius:6px;padding:9px 11px;font-size:12px;margin:10px 0}.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar input{flex:1;min-height:40px;border:1px solid var(--line);border-radius:6px;padding:8px 11px;font:inherit}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;min-width:920px;font-size:12px}th,td{border-bottom:1px solid #edf1ee;padding:11px 10px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;background:#fafcfb;white-space:nowrap}tr:last-child td{border-bottom:0}.words{font-weight:700}.clue{color:var(--muted);line-height:1.6;max-width:260px}.login{max-width:410px;margin:11vh auto}.login .panel{padding:28px}.login h1{font-size:25px;margin:0 0 6px}.login p{margin:0 0 22px;color:var(--muted);font-size:12px}.status{min-height:20px}
    @media(max-width:700px){main{padding:18px 14px 40px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}.brand{font-size:19px}.panel{padding:17px}.login{margin:7vh auto}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><div class="panel"><h1>管理后台</h1><p>维护词库与前台显示设置</p><form id="loginForm"><div class="field"><label>管理员账号</label><input id="username" autocomplete="username" required /></div><div class="field" style="margin-top:12px"><label>管理员密码</label><input id="password" type="password" autocomplete="current-password" required /></div><div id="loginError" class="error hidden"></div><button class="button primary" style="width:100%;margin-top:18px">登录</button></form></div></section>
  <main id="appView" class="hidden">
    <div class="top"><div class="brand">谁是卧底 <small>管理后台</small></div><button id="logout" class="button">退出登录</button></div>
    <section class="panel"><h2>站点设置</h2><div class="grid"><div class="field"><label>系统名称</label><input id="systemName" maxlength="40" /></div><div class="field"><label>备案号</label><input id="icp" maxlength="40" placeholder="例如：粤ICP备12345678号" /></div></div><div id="configStatus" class="status muted"></div><div class="actions"><button id="saveConfig" class="button primary">保存设置</button></div></section>
    <section class="panel"><h2>词库维护</h2><form id="wordForm"><input id="wordId" type="hidden" /><div class="grid"><div class="field"><label>主题</label><select id="category"><option value="daily">日常生活</option><option value="food">吃吃喝喝</option><option value="places">出行天地</option><option value="jobs">职业身份</option><option value="nature">自然万物</option><option value="culture">文娱时光</option><option value="sports">运动休闲</option><option value="tech">数码科技</option></select></div><div class="field"><label>难度</label><select id="difficulty"><option value="easy">轻松</option><option value="normal" selected>标准</option><option value="hard">烧脑</option></select></div><div class="field"><label>平民词</label><input id="wordA" maxlength="30" required /></div><div class="field"><label>卧底词</label><input id="wordB" maxlength="30" required /></div><div class="field"><label>共同点</label><textarea id="sharedTrait" maxlength="120" required></textarea></div><div class="field"><label>区别说明</label><textarea id="distinction" maxlength="240" required></textarea></div></div><div id="wordStatus" class="status muted"></div><div class="actions"><button class="button primary">保存词对</button><button id="resetWord" type="button" class="button">清空表单</button></div></form></section>
    <section class="panel"><div class="toolbar"><h2 style="margin:0">已有词对</h2><input id="search" placeholder="搜索词语或主题" /></div><div class="table-wrap"><table><thead><tr><th>主题</th><th>难度</th><th>词对</th><th>共同点</th><th>区别说明</th><th>操作</th></tr></thead><tbody id="wordRows"></tbody></table></div></section>
  </main>
  <script>
    const state={token:sessionStorage.getItem('wodi-admin-token')||'',words:[]};
    const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const categoryLabels={daily:'日常生活',food:'吃吃喝喝',places:'出行天地',jobs:'职业身份',nature:'自然万物',culture:'文娱时光',sports:'运动休闲',tech:'数码科技'}; const difficultyLabels={easy:'轻松',normal:'标准',hard:'烧脑'};
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json',...(state.token?{authorization:'Bearer '+state.token}:{}),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'请求失败');return data}
    function show(el,message,isError=false){el.textContent=message;el.className='status '+(isError?'error':'muted')}
    function fill(word){$('wordId').value=word.id;$('category').value=word.category;$('difficulty').value=word.difficulty;$('wordA').value=word.words[0];$('wordB').value=word.words[1];$('sharedTrait').value=word.sharedTrait;$('distinction').value=word.distinction;window.scrollTo({top:document.querySelector('#wordForm').offsetTop-20,behavior:'smooth'})}
    function resetForm(){$('wordForm').reset();$('wordId').value='';$('difficulty').value='normal';}
    function renderWords(){const query=$('search').value.trim().toLowerCase();$('wordRows').innerHTML=state.words.filter(w=>[w.words[0],w.words[1],w.sharedTrait,w.distinction,categoryLabels[w.category]].join(' ').toLowerCase().includes(query)).map(w=>`<tr><td>${esc(categoryLabels[w.category])}</td><td>${esc(difficultyLabels[w.difficulty])}</td><td class="words">${esc(w.words[0])} / ${esc(w.words[1])}</td><td class="clue">${esc(w.sharedTrait)}</td><td class="clue">${esc(w.distinction)}</td><td><button class="button" data-edit="${esc(w.id)}">编辑</button> <button class="button danger" data-delete="${esc(w.id)}">删除</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">没有匹配的词对</td></tr>'}
    async function load(){try{const config=await api('/api/admin/config');$('systemName').value=config.systemName;$('icp').value=config.icp;state.words=await api('/api/admin/words');renderWords();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}catch(error){state.token='';sessionStorage.removeItem('wodi-admin-token');$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');if(error.message!=='请先登录管理后台'){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden')}}}
    $('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').classList.add('hidden');try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});state.token=data.token;sessionStorage.setItem('wodi-admin-token',state.token);await load()}catch(error){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden')}});
    $('logout').addEventListener('click',()=>{state.token='';sessionStorage.removeItem('wodi-admin-token');location.reload()});
    $('saveConfig').addEventListener('click',async()=>{try{const data=await api('/api/admin/config',{method:'PUT',body:JSON.stringify({systemName:$('systemName').value,icp:$('icp').value})});$('systemName').value=data.systemName;$('icp').value=data.icp;show($('configStatus'),'已保存')}catch(error){show($('configStatus'),error.message,true)}});
    $('wordForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('wordId').value;const payload={category:$('category').value,difficulty:$('difficulty').value,words:[$('wordA').value,$('wordB').value],sharedTrait:$('sharedTrait').value,distinction:$('distinction').value};try{const saved=await api(id?'/api/admin/words/'+encodeURIComponent(id):'/api/admin/words',{method:id?'PUT':'POST',body:JSON.stringify(payload)});const index=state.words.findIndex(w=>w.id===saved.id);if(index<0)state.words.push(saved);else state.words[index]=saved;renderWords();resetForm();show($('wordStatus'),'已保存')}catch(error){show($('wordStatus'),error.message,true)}});
    $('resetWord').addEventListener('click',resetForm);$('search').addEventListener('input',renderWords);
    $('wordRows').addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const id=button.dataset.edit||button.dataset.delete;if(button.dataset.edit){const word=state.words.find(w=>w.id===id);if(word)fill(word);return}if(button.dataset.delete&&confirm('确定删除这组词对吗？')){try{await api('/api/admin/words/'+encodeURIComponent(id),{method:'DELETE'});state.words=state.words.filter(w=>w.id!==id);renderWords()}catch(error){alert(error.message)}}});
    if(state.token)load();
  </script>
</body>
</html>
